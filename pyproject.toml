[project]
name = "mcp-tools-orchestrator"
version = "0.1.0"
description = "MCP server that composes tools from multiple MCP servers for unified code execution"
readme = "README.md"
authors = [
    { name = "Aldrin Inbaraj", email = "aldrininbaraj@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "flask>=3.0.0",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.1",
    "requests>=2.32.0",
]

[tool.uv]
package = true

[tool.uv.sources]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
